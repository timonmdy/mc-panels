name: Create draft release

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Prepare release version
        id: version
        env:
          RELEASE_COMMENT: ${{ github.event.comment.body }}
        run: |
          version="$(node .github/scripts/prepare-release.cjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check release tag is unused
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          existing_tag="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$existing_tag" ]; then
            echo "Release tag $TAG already exists." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run build
      - name: Verify package artifact
        run: test -s dist/mcpanels.blueprint
      - name: Commit version bump to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json conf.yml
          git commit -m "chore: release v$VERSION"
          git push origin main
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/mcpanels.blueprint \
            --draft \
            --target main \
            --title "MC Panels v$VERSION" \
            --generate-notes
