name: Request release

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  actions: write
  pull-requests: read

concurrency:
  group: pr-version-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event.comment.author_association == 'OWNER' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/create-release')
    runs-on: ubuntu-latest
    steps:
      - name: Get pull request details
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          node - "$RUNNER_TEMP/pr.json" <<'NODE'
          const fs = require('node:fs');
          const pr = require(process.argv[2]);
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `head_repo=${pr.head.repo.full_name}\n`);
          fs.appendFileSync(output, `head_ref=${pr.head.ref}\n`);
          fs.appendFileSync(output, `head_sha=${pr.head.sha}\n`);
          fs.appendFileSync(output, `base_ref=${pr.base.ref}\n`);
          NODE
      - name: Check out trusted main scripts
        if: steps.pr.outputs.head_repo == github.repository && steps.pr.outputs.base_ref == 'main'
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Check out PR branch
        if: steps.pr.outputs.head_repo == github.repository && steps.pr.outputs.base_ref == 'main'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: source
      - name: Sync version and push release intent
        if: steps.pr.outputs.head_repo == github.repository && steps.pr.outputs.base_ref == 'main'
        id: version
        env:
          BASE_DIR: trusted
          WORKSPACE_DIR: source
          RELEASE_COMMENT: ${{ github.event.comment.body }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          version="$(node trusted/.github/scripts/prepare-release.cjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git -C source add package.json package-lock.json conf.yml .github/ISSUE_TEMPLATE/bug_report.yml
          if ! git -C source diff --cached --quiet; then
            git -C source config user.name "github-actions[bot]"
            git -C source config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C source commit -m "chore: prepare release v$version"
            git -C source push origin "HEAD:refs/heads/$HEAD_REF"
          fi
      - name: Mark pull request for release
        if: steps.pr.outputs.head_repo == github.repository && steps.pr.outputs.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create release --repo "$GITHUB_REPOSITORY" --description "Create a draft release when this PR merges" --color 0E8A16 --force
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label release
      - name: Run CI on the updated PR branch
        if: steps.pr.outputs.head_repo == github.repository && steps.pr.outputs.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" -f "ref=$HEAD_REF"
      - name: Reject unsupported pull request
        if: steps.pr.outputs.head_repo != github.repository || steps.pr.outputs.base_ref != 'main'
        run: |
          echo "Release requests require a same-repository PR targeting main." >&2
          exit 1
